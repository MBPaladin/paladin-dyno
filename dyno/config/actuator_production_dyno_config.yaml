# --- 0. PORTS ---
# See inhouse_dyno_config.yaml for the field definitions. On this bench the
# `DUT` device IS the client actuator, so its role is `client` -- not `input`.
# Do not infer roles from the AKD count; this bench has exactly two AKDs and
# neither is an input-side dyno motor.
ports:
  - role: output
    prefix: load
    device: LOAD
    attached: client_actuator_input
    cell: load_torque
  - role: client
    prefix: dut
    device: DUT
    attached: client_actuator
    cell: input_torque

# --- 1. SENSOR CONFIGURATION ---
# All logical sensors go here. Port mapping handles the hardware routing.
sensors:
  # --- Configurable (User Accessible) ---
  input_torque:
    port: ADC1
    supply: 24v
    fs_v: 10
    fs_pos: 100
    offset: 0

  # --- Reserved (System Functional) ---
  load_torque:
    port: RESERVED_ADC
    fs_v: 10
    fs_pos: 500
    offset: 0
    supply: NA  # Internal wiring has permanent power

  # --- Reserved (System Functional) ---
  load_stator_temp:
    port: RESERVED_RTD
    sensor_type: PT100

# --- 3. PHYSICAL PANEL WIRING HARNESS ---
# This maps the physical labels on your dyno's front panel to the internal EtherCAT hardware.
panel_ports:
  ADC1:
    signal_module: adc_1
    signal_channel: ch2
    power_12v: { module: 12v_power1, channel: 1 }
    power_24v: { module: 24v_power1, channel: 1 }
  ADC2:
    signal_module: adc_1
    signal_channel: ch3
    power_12v: { module: 12v_power1, channel: 2 }
    power_24v: { module: 24v_power1, channel: 2 }
  ADC3:
    signal_module: adc_1
    signal_channel: ch4
    power_12v: { module: 12v_power1, channel: 3 }
    power_24v: { module: 24v_power1, channel: 3 }
  ADC4:
    signal_module: adc_2
    signal_channel: ch1
    power_12v: { module: 12v_power1, channel: 4 }
    power_24v: { module: 24v_power1, channel: 4 }
  ADC5:
    signal_module: adc_2
    signal_channel: ch2
    power_12v: { module: 12v_power2, channel: 1 }
    power_24v: { module: 24v_power2, channel: 1 }
  ADC6:
    signal_module: adc_2
    signal_channel: ch3
    power_12v: { module: 12v_power2, channel: 2 }
    power_24v: { module: 24v_power2, channel: 2 }
  ADC7:
    signal_module: adc_2
    signal_channel: ch4
    power_12v: { module: 12v_power2, channel: 3 }
    power_24v: { module: 24v_power2, channel: 3 }
  ADC8:
    signal_module: adc_3
    signal_channel: ch1
    power_12v: { module: 12v_power2, channel: 4 }
    power_24v: { module: 24v_power2, channel: 4 }
  ADC9:
    signal_module: adc_3
    signal_channel: ch2
    power_12v: { module: 12v_power3, channel: 1 }
    power_24v: { module: 24v_power3, channel: 1 }
  ADC10:
    signal_module: adc_3
    signal_channel: ch3
    power_12v: { module: 12v_power3, channel: 2 }
    power_24v: { module: 24v_power3, channel: 2 }
  ADC11:
    signal_module: adc_3
    signal_channel: ch4
    power_12v: { module: 12v_power3, channel: 3 }
    power_24v: { module: 24v_power3, channel: 3 }
  RESERVED_ADC:
    signal_module: adc_1
    signal_channel: ch1
  RTD1:
    signal_module: rtd_module
    signal_channel: ch1
  RTD2:
    signal_module: rtd_module
    signal_channel: ch2
  RTD3:
    signal_module: rtd_module
    signal_channel: ch3
  RTD4:
    signal_module: rtd_module
    signal_channel: ch4
  RESERVED_RTD:
    signal_module: rtd_module
    signal_channel: ch8

# --- 2. PHYSICAL HARDWARE BUS ---
expected_slave_layout:
  - { model: EK1100, name: coupler }
  - { model: EL2502, name: pwm }
  - { model: EL3208, name: rtd_module }
  - { model: EL5042, name: encoder}
  - { model: EL2004, name: 24v_power1}
  - { model: EL2004, name: 24v_power2}
  - { model: EL2004, name: 24v_power3}
  - { model: EL2004_12v, name: 12v_power1}
  - { model: EL2004_12v, name: 12v_power2}
  - { model: EL2004_12v, name: 12v_power3}
  - { model: ELM3004, name: adc_1}
  - { model: ELM3004, name: adc_2}
  - { model: ELM3004, name: adc_3}
  - model: AKD
    name: LOAD
    params:
      flip_torque_sign: True
      gear_ratio: 1 #Output should always be set to 1
      motor_params:
        kt: 25.5
        k_tanh: 0.018
      motor_limits:
        torque: 450
        continuous_torque: 110 # Nm, continuous rating; grid_search cools down after points above this
        velocity: 13
        acceleration: 12 #Rad/s^2
        rotatum: 1800 #Nm/s, 4 x peak torque value
      drive_params:
        i_cont: 8
  - model: AKD
    name: DUT
    params:
      # flip_torque_sign: False
      # gear_ratio: 1 #Output should always be set to 1
      # motor_params:
      #   #kt: 6
      #   kt: 7.35
      #   k_tanh: 0.068
      #   #k_tanh: 0.15
      # motor_limits:
      #   torque: 73
      #   velocity: 31.5
      #   acceleration: 12 #Rad/s^2
      #   rotatum: 160 #Nm/s, 4 x peak torque value
      # drive_params:
      #   i_cont: 3

      flip_torque_sign: True
      gear_ratio: 26
      motor_params:
        kt: 5.3
        k_tanh: 0.025
      motor_limits:
        torque: 100
        continuous_torque: 4 # Nm, continuous rating; grid_search cools down after points above this
        velocity: 63
        acceleration: 12 #Rad/s^2
        rotatum: 320 #Nm/s, 4 x peak torque value
      drive_params:
        i_cont: 8


safeties: # Measured values over these limits will cause the test to stop.
  # `source` is an attribute path on the controller (same idiom as log_keys).
  output_torque: { source: devices.adc_1.load_torque, limit: 200 } # Nm on the output torque cell
  output_velocity: { source: devices.LOAD.velocity, limit: 31.5 } # rad/s on the output
  input_velocity: { source: devices.DUT.velocity, limit: 500 } # rad/s
  # input_torque was in the old limits list but was never checked in
  # actuator_production mode; uncomment to actually enforce it:
  # input_torque: { source: devices.adc_1.input_torque, limit: 15 }

gui_params: # defines length and resolution of the plots
  window_length_s: 30
  displayed_samples: 2048

# We want to change log keys between configs without having to change the control loop / adjust its code. In the section below, attributes to be logged / visualized are entered as a list of lists [str(log name readable), str(attribute of self to log)]

# log_keys: # Fixed values that aren't user adjustable
#   - [time, time]
#   - [dut_mode, devices.DUT.servo_drive_mode]
#   - [dut_torque_command, devices.DUT.torque_command]
#   - [dut_velocity_command, devices.DUT.velocity_command]
#   - [dut_position_command, devices.DUT.position_command]
#   - [dut_output_position, devices.DUT.position]
#   - [dut_projected_input_encoder, devices.DUT.inc_position]
#   - [dut_motor_position, devices.DUT.motor_position]
#   - [dut_velocity, devices.DUT.velocity]
#   - [dut_current, devices.DUT.current]
#   - [dut_effort, devices.DUT.effort]
#   - [load_mode, devices.LOAD.servo_drive_mode]
#   - [load_torque_command, devices.LOAD.torque_command]
#   - [load_velocity_command, devices.LOAD.velocity_command]
#   - [load_position_command, devices.LOAD.position_command]
#   - [load_position, devices.LOAD.position]
#   - [load_velocity, devices.LOAD.velocity]
#   - [load_current, devices.LOAD.current]
#   - [load_position_2, devices.encoder.position]

  #Keys for motor testing
log_keys: # Fixed values that aren't user adjustable
  - [time, time]
  - [dut_mode, devices.DUT.servo_drive_mode]
  - [dut_torque_command, devices.DUT.torque_command]
  - [dut_velocity_command, devices.DUT.velocity_command]
  - [dut_position_command, devices.DUT.position_command]
  - [dut_output_position, devices.DUT.position]
  - [dut_velocity, devices.DUT.velocity]
  - [dut_current, devices.DUT.current]
  - [load_mode, devices.LOAD.servo_drive_mode]
  - [load_torque_command, devices.LOAD.torque_command]
  - [load_velocity_command, devices.LOAD.velocity_command]
  - [load_position_command, devices.LOAD.position_command]
  - [load_position, devices.LOAD.position]
  - [load_velocity, devices.LOAD.velocity]
  - [load_current, devices.LOAD.current]
  - [load_position_2, devices.encoder.position]
  - [cycle_time_us, cycle_dt_us] # measured PDO loop interval
  - [wkc_error, wkc_error] # expected - actual working counter; 0 = healthy, >0 = dropped/late frame
  # Multisine preamble sample index (NaN outside a preamble). Analysis splits
  # the excitation into exact periods on this, not on timestamps.
  - [preamble_sample, preamble_sample]
  # ramp_break breakaway marker: the commanded torque the online detector
  # fired at, on that one sample only (NaN on every other sample).
  - [breakaway_torque, breakaway_torque]
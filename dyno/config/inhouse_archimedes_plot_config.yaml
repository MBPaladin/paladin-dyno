# Scope layout for inhouse_archimedes_dyno_config.yaml. Every data_key must
# exist in that config's resolved log_keys.
#
# ORDER MATTERS: the GUI draws the first `num_plots` entries (gui.py:97, 3 at
# present) and puts the rest behind the per-scope dropdown. Both position
# channels are first because the pair of them is what nearly every check on
# this rig reads -- ratio sign, centre, window, position persistence.
Output Position:
  title: Output Position
  unit: Rad
  range: # output travel between bumpers is about +/-1.75 rad around centre
    - -2.5
    - 2.5
  data_keys:
    - load_position
    - load_position_command
  legends:
    - Load Position
    - LOAD Position Command
  pens:
    - g
    - c
Input Position:
  title: Input Position
  unit: Rad
  range:
    - -150
    - 150
  data_keys:
    - dut_output_position
    - dut_position_command
  legends:
    - DUT Position
    - DUT Position Command
  pens:
    - r
    - c
Torque:
  title: Torque
  unit: Nm
  range:
    - -20
    - 20
  data_keys:
    - input_torque
    - load_torque
    - dut_torque_command
    - load_torque_command
  legends:
    - Measured Input Torque
    - Measured Output Torque
    - DUT Torque Command
    - LOAD Torque Command
  pens:
    - y
    - g
    - c
    - m
Velocity:
  title: Velocity
  unit: Rad/s
  range:
    - -400
    - 400
  data_keys:
    - dut_velocity
    - load_velocity
    - dut_velocity_command
    - load_velocity_command
  legends:
    - DUT Velocity
    - Load Velocity
    - DUT Velocity Command
    - LOAD Velocity Command
  pens:
    - r
    - g
    - c
    - c
Current:
  title: Current
  unit: A
  range:
    - -50
    - 50
  # current_clamp dropped: no clamp is fitted, so the sensor is commented out
  # in inhouse_archimedes_dyno_config.yaml and the trace would be a flat line.
  data_keys:
    - dut_current
    - load_current
  legends:
    - DUT Drive Current
    - Load Drive Current
  pens:
    - r
    - g
Temperature:
  title: Temperature
  unit: C
  range:
    - 0
    - 120
  # Top and bottom are the fitted absorber RTDs and carry the real safety.
  # load_stator_temp is on the unfitted RESERVED_RTD and draws as NaN; it is
  # kept here so it appears the moment that channel gets a sensor.
  data_keys:
    - pt100_rtd_top
    - pt100_rtd_bottom
    - load_stator_temp
  legends:
    - Top RTD
    - Bottom RTD
    - Load Winding Temp
  pens:
    - r
    - b
    - y

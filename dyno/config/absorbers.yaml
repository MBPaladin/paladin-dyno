# Drives here report current in A_rms, which is what the analysis path and
# setup_summary have always assumed. A drive that reports the quadrature-axis
# amplitude instead declares `current_units: peak` under drive_params -- it is
# a unit LABEL for reports, never a conversion (see dyno/src/analysis/texfmt.py).

RA080-01:
  type: rotary
  flip_torque_sign: True
  gear_ratio: 1 #Output should always be set to 1
  motor_params:
    kt: 5.3
    k_tanh: 0.025
  motor_limits:
    torque: 100
    velocity: 63
    acceleration: 12 #Rad/s^2
    rotatum: 320 #Nm/s, 4 x peak torque value
  drive_params:
    i_cont: 8


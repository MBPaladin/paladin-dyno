# Scope layout for the in-house rig. Every data_key here must exist in the
# resolved log_keys for inhouse_dyno_config.yaml (declared keys plus the
# sensors augment_log_keys appends), or the trace has nothing to pull.
#
# Differences from actuator_production_plot_config.yaml:
#   - dut_effort dropped: it is in that rig's commented-out log_keys block, not
#     its active one, so the trace was already dead there.
#   - ranges derated to match the bringup motor_limits (torque 25, velocity 5).
Output Torque:
  title: Torque
  unit: Nm
  range: # defines range of each scope
    - -30
    - 30
  # load_torque was commented out while ch1 had no cell wired to it. A 500 Nm
  # cell is fitted again as of the 2026-09-02/03 runs, where it tracks
  # load_current * kt to ~2%, so the trace is back.
  data_keys: # defines which log entries to pull for the scope
    - input_torque
    - load_torque
    - dut_torque_command
    - load_torque_command
  legends: # defines legends for the above keys
    - Measured Input Torque
    - Measured Output Torque
    - DUT Torque Command
    - LOAD Torque Command
  pens: # sets colors for each trace
    - y
    - g
    - c
    - c
Output Velocity:
  title: Velocity
  unit: Rad/s
  range:
    - -6
    - 6
  data_keys:
    - dut_velocity
    - load_velocity
    - dut_velocity_command
    - load_velocity_command
  legends:
    - DUT Velocity
    - Load Velocity
    - DUT Velocity Command
    - LOAD Velocity Command
  pens:
    - r
    - g
    - c
    - c
Output Position:
  title: Position
  unit: Rad
  range:
    - -0.1
    - 6.4
  data_keys:
    - dut_output_position
    - load_position
    - dut_position_command
    - load_position_command
  legends:
    - DUT Position
    - Load Position
    - DUT Position Command
    - LOAD Position Command
  pens:
    - r
    - g
    - c
    - c
Current Clamp:
  title: Current
  unit: A
  range: # matches the clamp's fs_pos (50 A) in inhouse_dyno_config.yaml
    - -50
    - 50
  # current_clamp dropped: no clamp is fitted, so the sensor is commented out in
  # inhouse_dyno_config.yaml and the trace would draw a flat line of NaN.
  data_keys:
    - dut_current
    - load_current
  legends:
    - DUT Drive Current
    - Load Drive Current
  pens:
    - r
    - g
Temperature:
  title: Temperature
  unit: C
  range:
    - 0
    - 120
  # Top and bottom are the fitted absorber RTDs. load_stator_temp is on the
  # unfitted RESERVED_RTD and draws as NaN; it is kept here so it appears the
  # moment that channel gets a sensor.
  data_keys:
    - pt100_rtd_top
    - pt100_rtd_bottom
    - load_stator_temp
  legends:
    - Top RTD
    - Bottom RTD
    - Load Winding Temp
  pens:
    - r
    - b
    - y

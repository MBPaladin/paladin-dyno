# In-house dyno (new build) - BRINGUP CONFIG
#
# Bus as scanned by ./dyno/utilities/bus_scan.sh: 6 slaves.
#   0 EK1100   coupler
#   1 EL3208   RTD  (8 ch)
#   2 ELM3004  ADC  (4 ch)
#   3 AKD      SMALL_INHOUSE_MOTOR (was DUT; renamed so tests do not pick it as
#              the input motor)
#   4 AKD      LOAD
#   5 ELMO     DUT  (actuator input side, 26:1 reduction to the output)
#
# Relative to actuator_production this rig has NO EL2502 (pwm), NO EL5042
# (encoder), NO EL2004/EL2004_12v power modules, and one ELM3004 instead of
# three.

# DUT is enumerated, read and logged, but never enabled or commanded.
# Remove this (or set false) only once the DUT drive is commissioned AND its
# motor and coupling are fitted - start_test enables both drives without it.
#
# It also relaxes the reaction-torque check: with no coupling fitted, the load
# motor's torque is not reacted into the DUT, so LOAD may be commanded to its
# full 200 Nm. Clearing this flag re-arms that check and caps output torque at
# DUT.torque x DUT.gear_ratio = 25 Nm until the DUT derate below is raised.
load_only: false
align_load_position_to_dut: false

# Cross-coupling torque feedforward onto LOAD (dyno_controller.step), sent as
# a current offset (AKD 0x60B2). See config_utils.compile_feedforward and
# Controller._load_feedforward.
#   fixed:    ratio x DUT torque command x DUT gear_ratio.
#   quadrant: forward_ratio when the DUT drives the load, backdrive_ratio when
#             the load drives the DUT (blended across speed reversals over
#             v_blend_rad_s), plus drag_nm along the LOAD velocity command.
#             Signs come from the drive flags, so the numbers are magnitudes.
# What LOAD is sent is logged as load_torque_ff; the effective settings are
# recorded in every log's resolved_config.
#
# History, 2026-10-21 (logs/skip/troubleshooting/feedforward_test):
#   - the old feedforward_ratio code default (0.8) applied silently to every
#     earlier run, but never reached the drive;
#   - it needed LOAD in cyclic synchronous velocity (velocity_op_mode: csv,
#     below) AND the drive's IL.KBUSFF set to 1 (default 0, saved in the drive);
#   - the fixed sign is only right with DUT flip_torque_sign: True (below).
#
# Quadrant numbers: refit on the warm Skip runs (ff_postwarmup_03/_04, LOAD
# VL.KP 4 / VL.KI 3): forward 1.02, backdrive 2.73, drag 1.38 Nm, 0.24 Nm rms
# over 20 plateaus. They agree with the 2026-10-19 cogging fit (1.02 / 2.68 /
# 1.26). They are per DUT torque COMMAND at DUT kt 0.02: change that kt and
# they change. Check with skip_ff_check_12A + check_ff.py, which reads the
# settings from the log.
feedforward:
  mode: fixed            # quadrant for the pilot; fixed reproduces the 0.8 runs
  ratio: 0.8
  forward_ratio: 1.02
  backdrive_ratio: 2.73
  drag_nm: 1.38
  v_blend_rad_s: 0.005
  max_nm: 30             # the client's output torque cap; also the cell safety

# Open-loop DUT compensation for Skip (dyno/src/dut_compensation.py): output
# torque target -> DUT current. Only commands from a grid with
# dut_compensation_profiles use it; everything else runs as before. Fitted from
# v2 by dyno/src/post_processors/skip/s15_comp_fit.py. phase_offset_rad maps the
# live motor angle onto v2's frame and must be re-measured after any Elmo power
# cycle (skip_phase_cal_R1a + s14_phase_cal.py). Other keys default in
# dut_compensation.compile_dut_compensation (max_current_a 30, max_output_nm 30,
# gate_rad_s [0.5, 1.5] motor, t_lead_s 0.0015, load_ff_ratio 1.0).
# Session refit by dyno/src/post_processors/skip/s17_session_refit.py from
# logs/skip/feedforward_compensation_tests/04_R3_hourlong_comptest/skip_comp_R3_ab.hdf5.
# naive_nm_per_a is pinned to the previous block so C0 is the same law.
# Session refit by dyno/src/post_processors/skip/s17_session_refit.py from
# logs/skip/feedforward_compensation_tests/04_R3_hourlong_comptest/skip_comp_R3_ab.hdf5, logs/skip/feedforward_compensation_tests/05_R3b_recal/skip_comp_R3b_refit.hdf5.
# naive_nm_per_a is pinned to the previous block so C0 is the same law.
dut_compensation:
  enabled: true
  phase_offset_rad: 0.1879
  max_current_a: 30.0
  naive_nm_per_a: 0.7859
  ripple_fade_rad_s: [0.25, 1.0]
  base:
    K_f: [0.499, 0.5175]
    K_b: [1.3538, 1.386]
    drag_nm: [0.2266, 0.336]
  speed_table:
    speed_rad_s: [0.1, 0.5, 2.0]
    K_f:
    - [0.499, 0.5175]
    - [0.5309, 0.5553]
    - [0.632, 0.6653]
    K_b:
    - [1.3538, 1.386]
    - [1.1611, 1.2719]
    - [0.9504, 1.055]
    drag_nm:
    - [0.2266, 0.336]
    - [0.1585, 0.2445]
    - [0.7654, 0.9535]
  quadrant_lines:
    speed_rad_s: [0.1, 0.5, 2.0]
    K_f:
    - [0.4868, 0.5037]
    - [0.5211, 0.5311]
    - [0.6053, 0.6446]
    D_f:
    - [0.0038, 0.0916]
    - [-0.018, -0.179]
    - [0.303, 0.6059]
    K_b:
    - [1.3345, 1.3654]
    - [1.1461, 1.2361]
    - [0.9127, 1.0268]
    D_b:
    - [0.381, 0.4996]
    - [0.2817, 0.5316]
    - [1.062, 1.171]
  harmonics:
  - group: h1
    order: 1
    cells:
      pos_backdrive: {a0: 0.1331, a1: 0.06555, phase: 1.6337}
      neg_backdrive: {a0: 0.2259, a1: 0.04456, phase: -1.8587}
      pos_forward: {a0: 0.0664, a1: 0.04604, phase: 1.0971}
      neg_forward: {a0: 0.1487, a1: 0.05215, phase: -1.6558}
  - group: h6
    order: 6
    cells:
      pos_backdrive: {a0: 0.0521, a1: 0.03846, phase: 0.9845}
      neg_backdrive: {a0: -0.0391, a1: 0.05629, phase: 2.8191}
      pos_forward: {a0: -0.0124, a1: 0.0116, phase: -0.5123}
      neg_forward: {a0: -0.0009, a1: 0.0108, phase: -1.9254}
  - group: hx
    order: 2
    cells:
      pos_backdrive: {a0: 0.0456, a1: 0.0192, phase: 0.7214}
      neg_backdrive: {a0: 0.0499, a1: 0.02255, phase: -1.6198}
      pos_forward: {a0: 0.0, a1: 0.01933, phase: 1.3772}
      neg_forward: {a0: 0.0092, a1: 0.01876, phase: 1.5798}
  profiles:
    C0_naive: []
    C1_base: [base]
    C2_speed: [base, speed]
    C3_h1: [base, h1]
    C4_h6: [base, h6]
    C5_hx: [base, hx]
    C6_all: [base, speed, h1, h6, hx]
    C1_repeat: [base]
    C7_qdrag: [base, speed, qdrag]
    C8_all_q: [base, speed, qdrag, h1, h6, hx]

# --- 0. PORTS ---
# The rig's mechanical ports. `role` is what commands / the UI / analysis
# target; `prefix` is what this bench's log channels are called (they differ on
# the gearbox bench, which is why both fields exist); `device` is the EtherCAT
# slave behind the port; `attached` is a free-text label for reports and figure
# titles -- NO code branches on it; `cell` names the torque sensor on that
# shaft. This block is carried into every log's resolved_config.json.
ports:
  - role: input
    prefix: dut
    device: DUT
    attached: none
    cell: input_torque
  - role: output
    prefix: load
    device: LOAD
    attached: none
    cell: load_torque

# --- 1. SENSOR CONFIGURATION ---
sensors:
  # Output torque cell
  load_torque:
    port: RESERVED_ADC_1
    fs_v: 5
    fs_pos: 500
    offset: 0
    supply: NA
    # The cell's signal chain splits its reading at 0 V on the wire: readings
    # above sit ~2 mV high, readings below ~2 mV low, and almost nothing lands
    # in between (a 0.4 Nm hole at 10 mV/Nm). Seen in every log since
    # 2026-08-27; the 2026-10-21 checkout (logs/skip/troubleshooting/
    # cell_torque_isolation) showed it follows the cell, amplifier or cable, not
    # the ELM3004 channel or its range: gap 3.9 / 3.6 / 3.0 mV on ch1 +/-5 V,
    # ch1 +/-10 V, ch2. Corrected in software before offset and tare, so the
    # GUI, the tare, the safeties and the log all see the corrected torque;
    # the uncorrected reading is logged as load_torque_raw. Delete both lines if
    # the amplifier is re-zeroed or fixed. See devices.ScaledChannels._scale.
    split_mv: 4.0
    split_center_mv: 0.0

  # Input torque cell
  input_torque:
    port: RESERVED_ADC_2
    fs_v: 10
    fs_pos: 20
    offset: 0
    supply: NA

  # No clamp fitted on this bench: ADC1/ch3 carries nothing, and the 2026-09-03
  # logs have no current_clamp dataset. Re-enable when one goes back on.
  # current_clamp:
  #   port: ADC1
  #   fs_v: 5
  #   fs_pos: 50
  #   offset: 0
  #   supply: NA

  # The two RTDs actually fitted to the absorber. These are the only working
  # temperature readings on this bench -- load_stator_temp below is on the
  # unfitted RESERVED_RTD (ch8) and reads NaN, which means its safety entry can
  # never fire. Do not rely on it alone.
  pt100_rtd_top:
    port: RTD1
    sensor_type: PT100

  pt100_rtd_bottom:
    port: RTD2
    sensor_type: PT100

  load_stator_temp:
    port: RESERVED_RTD
    sensor_type: PT100

# --- 2. PHYSICAL PANEL WIRING HARNESS ---
# Only ports backed by a module actually on this chain. Power routes are all
# gone with the EL2004s; master.py skips the supply step when the port carries
# no matching power_<supply> key, so omitting them is the supported way to say
# "unpowered".
panel_ports:
  RESERVED_ADC_1:
    signal_module: adc_1
    signal_channel: ch1
  RESERVED_ADC_2:
    signal_module: adc_1
    signal_channel: ch2
  ADC1:
    signal_module: adc_1
    signal_channel: ch3
  ADC2:
    signal_module: adc_1
    signal_channel: ch4
  RTD1:
    signal_module: rtd_module
    signal_channel: ch1
  RTD2:
    signal_module: rtd_module
    signal_channel: ch2
  RTD3:
    signal_module: rtd_module
    signal_channel: ch3
  RTD4:
    signal_module: rtd_module
    signal_channel: ch4
  RESERVED_RTD:
    signal_module: rtd_module
    signal_channel: ch8

# --- 3. PHYSICAL HARDWARE BUS ---
# Order is positional and must match the scan exactly. `coupler`, `rtd_module`
# and `adc_1` are not free-form labels: panel_ports, log_keys and safeties above
# resolve against them by name. LOAD and DUT are likewise fixed - the control
# loop reaches for devices.LOAD / devices.DUT directly.
#
# On HARDWARE these params are the base layer only: AKD.__init__ reads the
# drive's own name from SDO 0x2031 (the name set in WorkBench) and, if it
# matches an absorbers.yaml key, that entry OVERRIDES what is written here.
# Name the load drive RA400-0x and the conservative limits below are silently
# replaced by 450 Nm / 13 rad/s. In SIM the fake drives report SIM-<name>, which
# deliberately matches nothing, so these values are what actually apply.
expected_slave_layout:
  - { model: EK1100, name: coupler }
  - { model: EL3208, name: rtd_module }
  - { model: ELM3004, name: adc_1 }
  - model: AKD
    name: SMALL_INHOUSE_MOTOR
    params:
      absorber_library: false
      flip_torque_sign: True
      gear_ratio: 1
      motor_params:
        kt: 0.983
        k_tanh: 0.0001
      motor_limits:
        torque: 20
        continuous_torque: 20
        velocity: 600
        acceleration: 1000 #Rad/s^2
        rotatum: 20 #Nm/s, 4 x peak torque value
      drive_params:
        i_cont: 7
  - model: AKD
    name: LOAD
    params:
      absorber_library: false
      flip_torque_sign: True
      gear_ratio: 1 # Output should always be set to 1
      motor_params:
        kt: 7.79
        k_tanh: 0.0164
      motor_limits:
        torque: 500
        continuous_torque: 100
        velocity: 50
        acceleration: 20 #Rad/s^2
        rotatum: 1000 #Nm/s, 4 x peak torque value
      drive_params:
        i_cont: 15
        # Cyclic synchronous velocity (9) instead of profile velocity (3), so
        # the torque feedforward reaches the current loop. No drive-side ramp
        # in this mode: the drive tracks each 1 ms command. See devices.AKD.
        velocity_op_mode: csv

  # Actuator input drive. Position and velocity are in INPUT-shaft rad, rad/s:
  # the encoder is on the motor side and the actuator's 26:1 reduction sits
  # between it and the output. Hand-turn test 2026-10-15: one input rev read
  # ~8,090 counts and one output rev ~212,778, i.e. 2^13 = 8192 counts/rev x 26
  # to within hand error (1.2% / 0.1%). 0x6064 accumulated across 26 input revs
  # with no 8192-count steps, so the drive does not wrap per rev (bits 32).
  #
  # READ-ONLY FOR NOW. The 'telemetry' profile maps no position/velocity/torque
  # targets, and load_only is true so DUT is never enabled. The values marked
  # PLACEHOLDER only have to exist for the ELMO class to construct; none has
  # been commissioned. Before commanding this drive: set kt to the real motor,
  # i_rated against the torque cell (the drive's 0x6075/0x6076 both read 14.14,
  # i.e. an uncommissioned 1 Nm/A), and settle flip_direction_sign (the count
  # fell for a hand turn the operator called positive).
  - model: ELMO
    name: DUT
    params:
      absorber_library: false   # drive reports 'Drum'; keep absorbers.yaml out
      # True from 2026-10-21. With False, a positive torque command pushed the
      # shaft toward negative load_position and the load cell read negative
      # (2026-10-19 Skip cogging log). True aligns both with the command.
      # The cost: dut_current is logged in the drive's own frame, so it now
      # reads NEGATIVE for a positive command (about -50 A per Nm at kt 0.02).
      # In logs from before this date, forward (DUT drives) is tc*v < 0; from
      # here on it is tc*v > 0.
      flip_torque_sign: True
      flip_direction_sign: True
      gear_ratio: 26
      motor_params:
        kt: 0.02                 # PLACEHOLDER, drive's internal Nm/A
        k_tanh: 0.0001
      motor_limits:
        torque: 1               # derated; nothing should command this yet
        continuous_torque: .5
        velocity: 1200
        acceleration: 1000 #Rad/s^2
        rotatum: 200 #Nm/s
      drive_params:
        i_cont: 50.0           
        i_rated: 50.0          
        counts_per_rev: 8192
        position_counter_bits: 32
        pdo_profile: compact

# Measured values over these limits stop the test.
#
# IMPORTANT: actuator_production gets its stator over-temp protection from
# _aux_func_A3_Dyno, which dyno_controller.py:71 appends ONLY when
# mode == 'actuator_production'. In this mode that function does not run, so
# there is no fan control, no stack light, and no NaN check on the RTD. The
# load_stator_temp entry below is the only thermal protection here.
#
# Note also that _safety_trigger compares abs(value) > limit, and abs(nan) is
# never > limit - so a failed/disconnected RTD reads NaN and silently disables
# this check rather than tripping it.
safeties:
  output_torque: { source: devices.adc_1.load_torque, limit: 30 } # Nm
  output_velocity: { source: devices.LOAD.velocity, limit: 200 } # rad/s, derated for bringup
  input_velocity: { source: devices.DUT.velocity, limit: 1200 } # rad/s, catches a back-driven DUT
  load_stator_temp: { source: devices.rtd_module.load_stator_temp, limit: 100 } # C

# Torque cell tare: the GUI's Tare button averages each listed cell at rest and
# applies the negated mean as a session zero, on top of (never merged into) the
# sensors' config `offset`. The bias is recorded in the log's `tare` attribute
# and in the run's setup report. Note that taring shifts the torque safeties
# above with it, since they read the same corrected value.
tare:
  duration_s: 3.0        # averaging window; long enough to average out thermal/mains wander
  sensors: [load_torque, input_torque]
  max_velocity: 0.05     # rad/s, tare is refused/aborted if either machine turns faster
  warn_frac_fs: 0.02     # bias above 2% of a cell's fs_pos is called out as suspicious

gui_params: # defines length and resolution of the plots
  window_length_s: 30
  displayed_samples: 2048

# Attributes to log / visualise, as [readable name, attribute path on the
# controller]. Sensors declared above are appended automatically by
# augment_log_keys, so input_torque / load_torque / load_stator_temp are logged
# without appearing here.
#
# load_position_2 (devices.encoder.position) is intentionally absent: the EL5042
# is not on this chain.
log_keys:
  - [time, time]
  - [dut_mode, devices.DUT.servo_drive_mode]
  - [dut_torque_command, devices.DUT.torque_command]
  - [dut_velocity_command, devices.DUT.velocity_command]
  - [dut_position_command, devices.DUT.position_command]
  - [dut_output_position, devices.DUT.position]
  - [dut_velocity, devices.DUT.velocity]
  - [dut_current, devices.DUT.current]
  - [load_mode, devices.LOAD.servo_drive_mode]
  - [load_torque_command, devices.LOAD.torque_command]
  - [load_velocity_command, devices.LOAD.velocity_command]
  - [load_position_command, devices.LOAD.position_command]
  - [load_position, devices.LOAD.position]
  - [load_velocity, devices.LOAD.velocity]
  - [load_current, devices.LOAD.current]
  # Raw DS402 status words. Decode with ./dyno/drive_status.sh's bit table, or
  # read them straight: bit3 = fault, bit6 = switch on disabled, bits 0-2 =
  # ready/switched on/enabled. 0 in bits 0-3 and 6 is the 'undefined' state.
  - [load_statusword, devices.LOAD.statusword]
  - [dut_statusword, devices.DUT.statusword]
  # The AKD that used to be DUT. Logged so its data is not lost to the rename.
  - [small_motor_mode, devices.SMALL_INHOUSE_MOTOR.servo_drive_mode]
  - [small_motor_position, devices.SMALL_INHOUSE_MOTOR.position]
  - [small_motor_velocity, devices.SMALL_INHOUSE_MOTOR.velocity]
  - [small_motor_current, devices.SMALL_INHOUSE_MOTOR.current]
  - [small_motor_statusword, devices.SMALL_INHOUSE_MOTOR.statusword]
  - [cycle_time_us, cycle_dt_us] # measured PDO loop interval
  - [wkc_error, wkc_error] # expected - actual working counter; 0 = healthy
  # Multisine preamble sample index (NaN outside a preamble). Analysis splits
  # the excitation into exact periods on this, not on timestamps.
  - [preamble_sample, preamble_sample]
  # ramp_break breakaway marker: the commanded torque the online detector
  # fired at, on that one sample only (NaN on every other sample).
  - [breakaway_torque, breakaway_torque]
  # Load cell before its split correction (sensors.load_torque.split_mv):
  # untared and uncorrected, i.e. what the wire said.
  - [load_torque_raw, devices.adc_1.load_torque_raw]
  # LOAD torque feedforward actually sent, Nm in LOAD's command frame
  # (feedforward: above). 0 whenever the feedforward branch is not active.
  - [load_torque_ff, load_torque_ff]
  # DUT compensation (dut_compensation: above). NaN when not active.
  # target = output torque asked for (Nm); current = DUT amps the law sent;
  # ripple = predicted angle-locked torque it cancelled (Nm); omega = its motor
  # speed estimate (rad/s); quadrant = +1 forward / -1 backdrive; profile =
  # index of the profile in sorted(profiles).
  - [dut_comp_target, dut_comp_target]
  - [dut_comp_current, dut_comp_current]
  - [dut_comp_ripple, dut_comp_ripple]
  - [dut_comp_omega, dut_comp_omega]
  - [dut_comp_quadrant, dut_comp_quadrant]
  - [dut_comp_profile, dut_comp_profile]

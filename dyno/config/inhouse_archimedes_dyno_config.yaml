# In-house dyno, IMSystems Archimedes Drive (43:1, counter-rotating, 200 deg
# output travel between internal endstops).
#
# See dyno/docs/archimedes_gearbox_implementation_plan.md and the companion
# archimedes_gearbox_implementation_log.md. Launch with
# ./launch/inhouse_archimedes.sh. Kept separate from inhouse_dyno_config.yaml so
# day-to-day edits there cannot disturb this setup.
#
# CONFIRMED ON THE DYNO 2026-09-14 (bus_scan.sh + drive_status.sh, both inert):
#   - 5 slaves on enp86s0: EK1100, EL3208, ELM3004, AKD, AKD. The Elmo MAC
#     drive is off the chain, as this config requires.
#   - Slave 3 reports DRV.NAME "RTC-0020" (small, 20 Nm / 600 rad/s) = DUT =
#     input motor. Slave 4 reports "RTC-0200" (large, 220 Nm) = LOAD =
#     absorber. That is the order below.
#   - BOTH names have an absorbers.yaml entry, so that file WOULD have
#     overridden the limits below (it did exactly that on the 2026-09-03 run --
#     see its resolved_config provenance). Each AKD now sets
#     `absorber_library: false`, which opts it out. Check the bring-up
#     provenance print still says "dyno config" for every motor_limits value.
#
# STILL TO VERIFY ON THE DYNO (see the log's open items):
#   - The 20 Nm input cell is fitted and wired on the small AKD's shaft.
#     `load_torque` (the 500 Nm output cell) is confirmed live and agrees with
#     load_current * kt to ~2%; `input_torque` has read a dead -0.03 Nm in
#     every recent log, but the input motor never drove in any of them, so
#     that is not yet evidence either way.
#   - Torque and direction signs (flip_torque_sign), Step 1 of the plan.
#
# DIRECT-COUPLE RUNS (no gearbox): set DUT gear_ratio to 1 and
# position_window.enabled to false. Leaving -43 lets the test builder allow 43x
# the torque through the input cell's shaft; the input_torque safety is the only
# backstop then.

load_only: false

# The controller normally copies DUT position into LOAD.position_offset early
# in each session, with no gear ratio. That corrupts the output position the
# window reads, so it is off here.
align_load_position_to_dut: false

# Cross-coupling torque feedforward. It assumes a fixed positive ratio; this
# drive reverses and creeps, so it is off.
feedforward_ratio: 0.0

# --- Output position window ---
# Centre is declared by the operator each session (output vertical). Start is
# refused until centre is declared, touch-off has passed against that centre,
# and the output is inside the window. During a test, leaving the window (or a
# NaN reading) trips the test like any other safety. Units: rad at the output.
position_window:
  enabled: true
  source: devices.LOAD.position   # absorber encoder, direct to output
  half_window_rad: 1.50           # ~86 deg; test trips beyond centre +/- this
  # Early trip: moving outward at v, trip when |pos| + v^2/(2*stop_decel) passes
  # the window, so the stopped output lands inside it. PLACEHOLDER, deliberately
  # low: replace with the output deceleration measured in the STO coast check.
  # At 50, traverses ending at +/-76 deg false-trip above ~2300 rpm input
  # (5000 rad/s^2 test accel); 3600 rpm needs >= ~76.
  stop_decel_rad_s2: 50.0
  velocity_source: devices.LOAD.velocity
  require_touch_off: true
  touch_off:
    # Contact is declared when any of these reads above torque_nm for
    # trip_samples consecutive cycles. The output cell sits between absorber and
    # gearbox. Gearbox drag at jog speed must be well under torque_nm.
    torque_sources: [devices.adc_1.load_torque]
    torque_nm: 5.0                # same low torque every time (rubber compresses)
    trip_samples: 10              # 10 ms at 1 kHz
    velocity_rad_s: 0.05          # outward speed beyond slow_from_rad
    approach_velocity_rad_s: 0.25 # speed inside slow_from_rad and toward centre
    slow_from_rad: 1.40
    arm_distance_rad: 0.03        # torque cap waived for this far when backing off a bumper
    expected_half_span_rad: 1.745 # 100 deg each side of centre
    tolerance_rad: 0.09           # ~5 deg: pass/fail for each bumper
    max_excursion_rad: 1.95       # jog/touch-off never goes further than this from centre

# --- 0. PORTS ---
ports:
  - role: input
    prefix: dut
    device: DUT
    attached: Archimedes Drive input
    cell: input_torque
  - role: output
    prefix: load
    device: LOAD
    attached: Archimedes Drive output
    cell: load_torque

# --- 1. SENSOR CONFIGURATION ---
sensors:
  # Output torque cell
  load_torque:
    port: RESERVED_ADC_1
    fs_v: 5
    fs_pos: 500
    offset: 0
    supply: NA

  # Input torque cell
  input_torque:
    port: RESERVED_ADC_2
    fs_v: 10
    fs_pos: 20
    offset: 0
    supply: NA

  # No clamp fitted on this bench. Left declared it reads a flat -0.001 A
  # (measured 2026-09-14, 148 s passive: sd 0.0003 A over 375 distinct values),
  # which is a trace of nothing on every scope. Re-enable when one goes back on.
  # current_clamp:
  #   port: ADC1
  #   fs_v: 5
  #   fs_pos: 50
  #   offset: 0
  #   supply: NA

  # The two RTDs actually fitted to the absorber. RESERVED_RTD (ch8) below has
  # no sensor on it and reads NaN -- confirmed over 147817 consecutive samples
  # on 2026-09-14 -- so a safety watching only that channel can never fire.
  # These two are the real thermal protection for the efficiency runs, which
  # hold 100 Nm continuous on the absorber.
  pt100_rtd_top:
    port: RTD1
    sensor_type: PT100

  pt100_rtd_bottom:
    port: RTD2
    sensor_type: PT100

  load_stator_temp:
    port: RESERVED_RTD
    sensor_type: PT100

# --- 2. PHYSICAL PANEL WIRING HARNESS ---
panel_ports:
  RESERVED_ADC_1:
    signal_module: adc_1
    signal_channel: ch1
  RESERVED_ADC_2:
    signal_module: adc_1
    signal_channel: ch2
  ADC1:
    signal_module: adc_1
    signal_channel: ch3
  ADC2:
    signal_module: adc_1
    signal_channel: ch4
  RTD1:
    signal_module: rtd_module
    signal_channel: ch1
  RTD2:
    signal_module: rtd_module
    signal_channel: ch2
  RTD3:
    signal_module: rtd_module
    signal_channel: ch3
  RTD4:
    signal_module: rtd_module
    signal_channel: ch4
  RESERVED_RTD:
    signal_module: rtd_module
    signal_channel: ch8

# --- 3. PHYSICAL HARDWARE BUS ---
# Positional and must match the scan. The two AKDs keep the order they have in
# inhouse_dyno_config.yaml; their names (and so their roles) differ.
expected_slave_layout:
  - { model: EK1100, name: coupler }
  - { model: EL3208, name: rtd_module }
  - { model: ELM3004, name: adc_1 }
  # Small AKD (RTC-0020): input motor.
  - model: AKD
    name: DUT
    params:
      # This drive's DRV.NAME is RTC-0020, which HAS an absorbers.yaml entry
      # (confirmed on the bench 2026-09-14). That entry would override the
      # limits below -- accel 5000 -> 1000, torque 15 -> 20, velocity 400 ->
      # 600, i_cont 7 -> 20. Opt out; this file is the only source.
      absorber_library: false
      flip_torque_sign: False
      # Encoder handedness. Hand test 2026-09-14: rotating the input positive
      # in the right-handed frame read NEGATIVE on dut_output_position, while
      # positive input torque read positive on the cell. The encoder disagreed
      # with its own torque cell, so negate it. flip_direction_sign negates
      # position and velocity coherently, feedback and command
      # (devices.py:1129/1134/1164/1176) -- unlike flip_torque_sign, which
      # only negates the commanded current. See log finding 16.
      flip_direction_sign: True
      # Signed: output counter-rotates. Nothing in the control path uses the
      # sign while feedforward_ratio is 0; the test builder takes abs().
      # UNRESOLVED: -43 assumes both shafts in the SAME handedness. The bench
      # convention is input right-handed, output left-handed, which makes the
      # ratio +43, and with both encoders now flipped the logged channels
      # should show +43 too. Cannot be confirmed until the gearbox is fitted
      # (the lockout plate is on as of 2026-09-14). Inert in the control path;
      # fix the sign before any analysis relies on it.
      gear_ratio: -43
      motor_params:
        kt: 0.983
        k_tanh: 0.0001
      motor_limits:
        torque: 15              # input cell is 20 Nm FS; test needs ~3.3 Nm + accel
        continuous_torque: 15
        velocity: 400           # 3600 rpm = 377 rad/s
        acceleration: 5000      # rad/s^2, top speeds do not fit the throw at less
        rotatum: 500
      drive_params:
        i_cont: 7
  # Large AKD (RTC-0200): absorber, direct to the output.
  - model: AKD
    name: LOAD
    params:
      # DRV.NAME is RTC-0200, which HAS an absorbers.yaml entry (confirmed on
      # the bench 2026-09-14). That entry would override the limits below --
      # acceleration 150 -> 20 (the plan's 3600 rpm shuttles need ~116 at the
      # output) and velocity 12 -> 50, undoing the deliberate output-speed cap.
      absorber_library: false
      flip_torque_sign: True
      # Hand test 2026-09-14, output bolted to the lockout plate: rotating the
      # output negative in the left-handed frame read negative on load_torque
      # (correct) but a small POSITIVE delta on load_position. Against a
      # grounded shaft the deflection must follow the applied torque, so the
      # encoder disagreed with its own cell. Negating it makes K = dT/dtheta
      # come out positive, which is the whole point of the lockout-plate
      # stiffness baseline. See log finding 16.
      # NOTE: this inverts the jog buttons -- "Jog +" now drives the other way
      # and touch-off's "+ bumper" is the other bumper. Harmless, the bumpers
      # are symmetric, but expect it at the bench.
      flip_direction_sign: True
      gear_ratio: 1 # Output should always be set to 1
      motor_params:
        kt: 7.79
        k_tanh: 0.0164
      motor_limits:
        torque: 200
        continuous_torque: 100
        velocity: 12            # max test output speed is 8.8 rad/s
        acceleration: 150       # rad/s^2; 3600 rpm shuttles need ~116 at the output
        rotatum: 1000
      drive_params:
        i_cont: 15

# Measured values over these limits stop the test. nan_trips: a NaN reading
# trips too (it would otherwise silently pass). The RTD is left without it
# because an unfitted RTD reads NaN.
safeties:
  output_torque: { source: devices.adc_1.load_torque, limit: 200, nan_trips: true } # Nm; raise only if slip torque needs it
  input_torque: { source: devices.adc_1.input_torque, limit: 15, nan_trips: true } # Nm; input cell is 20 Nm FS
  output_velocity: { source: devices.LOAD.velocity, limit: 12, nan_trips: true } # rad/s; tests reach 8.8
  input_velocity: { source: devices.DUT.velocity, limit: 420, nan_trips: true } # rad/s; tests reach 377
  # Absorber temperature. PROVISIONAL LIMIT, see the EL3208 element-type item
  # in the implementation log: devices.py writes element type 1 for 'PT100',
  # and if Beckhoff's enum is 0=PT100/1=NI100 then a Pt sensor is being read on
  # the Ni curve and every reading is ~30% low. 70 trips at a true ~100 C under
  # that reading and at 70 C if the scale is already right, so it is safe both
  # ways. Raise it to the real winding limit once the sweep settles the scale.
  absorber_temp_top: { source: devices.rtd_module.pt100_rtd_top, limit: 70, nan_trips: true } # C
  absorber_temp_bottom: { source: devices.rtd_module.pt100_rtd_bottom, limit: 70, nan_trips: true } # C
  # RESERVED_RTD (ch8) is unfitted and reads NaN, so deliberately NO nan_trips
  # here: this entry is inert until a sensor goes on that channel. The two
  # entries above are what actually protect the absorber.
  load_stator_temp: { source: devices.rtd_module.load_stator_temp, limit: 100 } # C
  # No wkc_error safety. The bus is clean at idle -- 0 events in 147817
  # consecutive cycles on 2026-09-14 -- and the isolated counts seen before
  # that were the first cycle after OP entry, not running faults. A frame-loss
  # trip here would only ever be a nuisance stop mid-test; losing a slave still
  # faults the drives, which stops the test through the existing drive-fault
  # path. wkc_error stays in log_keys so a post-mortem can look at it.

tare:
  duration_s: 3.0
  sensors: [load_torque, input_torque]
  max_velocity: 0.05
  warn_frac_fs: 0.02

gui_params:
  window_length_s: 30
  displayed_samples: 2048

log_keys:
  - [time, time]
  - [dut_mode, devices.DUT.servo_drive_mode]
  - [dut_torque_command, devices.DUT.torque_command]
  - [dut_velocity_command, devices.DUT.velocity_command]
  - [dut_position_command, devices.DUT.position_command]
  - [dut_output_position, devices.DUT.position]
  - [dut_velocity, devices.DUT.velocity]
  - [dut_current, devices.DUT.current]
  - [load_mode, devices.LOAD.servo_drive_mode]
  - [load_torque_command, devices.LOAD.torque_command]
  - [load_velocity_command, devices.LOAD.velocity_command]
  - [load_position_command, devices.LOAD.position_command]
  - [load_position, devices.LOAD.position]
  - [load_velocity, devices.LOAD.velocity]
  - [load_current, devices.LOAD.current]
  - [load_statusword, devices.LOAD.statusword]
  - [dut_statusword, devices.DUT.statusword]
  - [cycle_time_us, cycle_dt_us]
  - [wkc_error, wkc_error]
  - [preamble_sample, preamble_sample]
  - [breakaway_torque, breakaway_torque]

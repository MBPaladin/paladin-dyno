
behaviors:
  - id: SIM_DEMO
    description: short closed-loop sanity sequence for the simulation sandbox
    type: grid_search
    settings:
      input_motor:
        control_mode: velocity
        command_list: [-5,-2,2, 5]
      output_motor:
        control_mode: torque
        command_list: [5, -5]
      loop_order: [velocity, torque]
      duration_per_point_s: 2
      settle_time_s: 0.5
      transition_rate: 0.5
